name: Update JoJo Quotes

on:
  # Permite rodar manualmente pela aba Actions
  workflow_dispatch:

  # Roda automaticamente quando algum arquivo-fonte mudar
  push:
    branches:
      - main
    paths:
      - "sources/**"
      - "extract_quotes.py"

permissions:
  contents: write

jobs:
  update-quotes:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Converter quotes
        run: python extract_quotes.py

      - name: Mostrar resultado
        run: |
          echo "Conteúdo gerado:"
          wc -l "jojo quotes.csv"
          head -n 5 "jojo quotes.csv"

      - name: Salvar CSV atualizado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "jojo quotes.csv"

          if git diff --cached --quiet; then
            echo "Nenhuma alteração no CSV."
          else
            git commit -m "Update JoJo quotes"
            git push
          fi
